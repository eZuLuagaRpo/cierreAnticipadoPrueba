[versioneer]
VCS = git
style = pep440
versionfile_source = src/compensa_provision/_version.py
versionfile_build = compensa_provision/_version.py
tag_prefix = ''

[metadata]
name = compensa-provision
author = Emanuel Zuluaga Restrepo
author_email = emzulu@bancolombia.com.co
description = ETL compensa provision construida sobre Orchestrator 2
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
package_dir=
    =src
packages=find:
python_requires = >=3.9.12
include_package_data = True
install_requires =
    orquestador2>=1.2.5

[options.package_data]
* = static/*.json, static/sql/*.sql, static/sql/etl/*.sql

[options.packages.find]
where=src

[options.entry_points]
console_scripts =
    compensa_provision = compensa_provision.ejecucion:ejecutar
