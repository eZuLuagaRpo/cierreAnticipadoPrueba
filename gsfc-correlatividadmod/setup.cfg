[versioneer]
VCS = git
style = pep440
versionfile_source = src/an0016001_gsfc_correlatividadmod/_version.py
versionfile_build = an0016001_gsfc_correlatividadmod/_version.py
tag_prefix = ''

[metadata]
name = an0016001-gsfc-correlatividadmod
author = sanmolin
author_email = sanmolin@bancolombia.com.co
description = This is an empty package template for Orchestrator 2
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
package_dir=
    =src
packages=find:
python_requires = >=3.9.12
include_package_data = True
install_requires =
    orquestador2>=1.2.5

[options.package_data]
* = static/*.json, static/sql/*.sql

[options.packages.find]
where=src

[options.entry_points]
console_scripts =
    an0016001_gsfc_correlatividadmod = an0016001_gsfc_correlatividadmod.ejecucion:main